apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
spec:
  type: NodePort # type of service 
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080 # containerport
      targetPort: 8080 # container target port
      nodePort: 30005 # node port
    - name: agent
      port: 50000
      targetPort: 50000
